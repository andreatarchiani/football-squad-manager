name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test and deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build production application
        run: npm run build

      - name: Test Firestore Security Rules
        run: npm run test:rules

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting and Firestore Security Rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project football-squad-manager-6fdaa

      - name: Notify successful deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 11,
              body: `@andreatarchiani **Firebase: deploy completato correttamente.** La nuova versione è disponibile su https://football-squad-manager-5673e.web.app. [Dettagli del deploy](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Commit: \`${context.sha}\`.`
            });

      - name: Notify failed deployment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 11,
              body: `@andreatarchiani **Deploy Firebase fallito.** La versione precedente resta quella pubblicata; controlla [i log del deploy](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Commit: \`${context.sha}\`.`
            });
